---
name: Mac DMG Test Build
# Standalone, on-demand UNSIGNED macOS DMG builder for QA/testing.
#
# Intentionally NOT part of the release pipeline: no `environment: Production`,
# no secrets, no Sentry/updater/signing. It builds the Tauri/CEF desktop app
# for both macOS arches and uploads each `.dmg` as a downloadable Actions
# artifact. The DMGs are UNSIGNED / un-notarized — install by right-clicking
# the app → Open, or clear quarantine with:
#   xattr -dr com.apple.quarantine /Applications/OpenHuman.app
#
# This workflow lives only on the test branch — delete it before merging.
on:
  workflow_dispatch:
    inputs:
      app_env:
        description: APP_ENVIRONMENT baked into the bundle (backend URL target).
        required: false
        type: choice
        default: staging
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: mac-dmg-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "DMG: ${{ matrix.settings.arch }}"
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        settings:
          - arch: apple-silicon
            target: aarch64-apple-darwin
          - arch: intel
            target: x86_64-apple-darwin
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_URL: ${{ inputs.app_env == 'production' && 'https://api.tinyhumans.ai/' || 'https://staging-api.tinyhumans.ai/' }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # rust-toolchain.toml pins a newer toolchain that overrides the
      # dtolnay-installed one; add the darwin targets to the ACTIVE (override)
      # toolchain so the cross build finds `core` (mirrors build-desktop.yml).
      - name: Ensure macOS targets on the active toolchain
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # CEF (~400MB Chromium distribution) is downloaded by cef-dll-sys on the
      # first build. Cache per-target across runs.
      - name: Cache CEF binary distribution
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/tauri-cef
            ~/.cache/tauri-cef
          key: cef-${{ matrix.settings.target }}-${{ hashFiles('app/src-tauri/Cargo.toml') }}
          restore-keys: |
            cef-${{ matrix.settings.target }}-

      # Only the vendored fork bundles CEF correctly; stock @tauri-apps/cli
      # produces broken bundles.
      - name: Cache vendored tauri-cli binary
        id: tauri-cli-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: vendored-tauri-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/src-tauri/vendor/tauri-cef/crates/tauri-cli/Cargo.toml') }}

      - name: Install vendored tauri-cli (cef-aware bundler)
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --path app/src-tauri/vendor/tauri-cef/crates/tauri-cli

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned DMG (${{ matrix.settings.target }})
        working-directory: app
        env:
          OPENHUMAN_APP_ENV: ${{ inputs.app_env }}
          VITE_OPENHUMAN_APP_ENV: ${{ inputs.app_env }}
          VITE_BACKEND_URL: ${{ env.BASE_URL }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # No signing / no updater artifacts for a test build. The static
          # tauri.conf.json already sets createUpdaterArtifacts:false; pass it
          # explicitly so no minisign key is ever required.
          WITH_UPDATER: "false"
        run: |
          NODE_OPTIONS="--max-old-space-size=8192" cargo tauri build \
            --target ${{ matrix.settings.target }} \
            -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Locate produced DMG
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_ROOTS=(
            "app/src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg"
            "target/${{ matrix.settings.target }}/release/bundle/dmg"
          )
          DMG=""
          for root in "${SEARCH_ROOTS[@]}"; do
            [ -d "$root" ] || continue
            DMG="$(find "$root" -name '*.dmg' | head -1)"
            [ -n "$DMG" ] && break
          done
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg produced for ${{ matrix.settings.target }}"
            find . -name '*.dmg' 2>/dev/null || true
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenHuman-${{ matrix.settings.arch }}-${{ matrix.settings.target }}
          path: ${{ steps.collect.outputs.dmg }}
          if-no-files-found: error
